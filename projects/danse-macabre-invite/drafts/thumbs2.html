<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Thumbnails 2</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box} body{background:#777;padding:40px;display:flex;flex-wrap:wrap;gap:40px}
.artboard{position:relative;overflow:hidden;isolation:isolate;width:1080px;height:1920px;background:#6d6e72;flex:none;color:#41140d;font-family:Unbounded}
.blob{position:absolute;background:#bb432d}
.fig{position:absolute;left:0;width:1080px;-webkit-mask:linear-gradient(#000 70%,transparent 88%);mask:linear-gradient(#000 70%,transparent 88%)}
.t{position:absolute;display:block}
.v{position:absolute;top:90px;bottom:90px;writing-mode:vertical-rl;font:700 46px/1 Unbounded;text-align:center}
.date{position:absolute;right:70px;top:70px;font:900 92px/.95 Unbounded;text-align:right}
.info{position:absolute;left:70px;right:70px;bottom:80px;display:flex;justify-content:space-between;font:500 36px/1.3 Unbounded}
</style></head><body>
<section class="artboard" data-name="t1-behind-flames">
  <div class="blob" style="left:-160px;top:880px;width:620px;height:560px;border-radius:58% 42% 63% 37%/45% 55% 45% 55%"></div>
  <div class="blob" style="right:-200px;top:380px;width:560px;height:700px;border-radius:40% 60% 35% 65%/60% 40% 60% 40%"></div>
  <img class="t" src="../assets/t-danse-red.svg" style="left:48px;top:540px;width:984px">
  <img class="fig" src="../assets/figure-ink.png" style="top:-100px"><img class="fig" src="../assets/figure-blood.png" style="top:-100px">
  <div class="v" style="left:70px;transform:rotate(180deg)">PRIVATE PARTY</div><div class="v" style="right:70px">INVITATION ONLY</div>
  <div class="date">31.10</div>
  <div class="info"><div>RUE ROBERT<br>STUMPER</div><div style="text-align:right">BRING A DRINK<br>TO SHARE</div></div>
</section>
<section class="artboard" data-name="t2-stack-bottom">
  <div class="blob" style="left:-120px;top:1120px;width:1320px;height:760px;border-radius:50% 50% 40% 60%/60% 50% 50% 40%"></div>
  <div class="blob" style="right:-220px;top:120px;width:520px;height:600px;border-radius:40% 60% 35% 65%/60% 40% 60% 40%"></div>
  <img class="fig" src="../assets/figure-ink.png" style="top:-380px"><img class="fig" src="../assets/figure-blood.png" style="top:-380px">
  <img class="t" src="../assets/t-danse-stack.svg" style="left:48px;top:1060px;width:984px">
  <div class="v" style="left:70px;transform:rotate(180deg)">PRIVATE PARTY</div><div class="v" style="right:70px">INVITATION ONLY</div>
  <div class="date">31.10</div>
  <div class="info"><div>RUE ROBERT<br>STUMPER</div><div style="text-align:right">BRING A DRINK<br>TO SHARE</div></div>
</section>
<section class="artboard" data-name="t3-stack-top-flames">
  <div class="blob" style="left:-200px;top:1100px;width:700px;height:640px;border-radius:58% 42% 63% 37%/45% 55% 45% 55%"></div>
  <div class="blob" style="right:-160px;top:160px;width:560px;height:620px;border-radius:40% 60% 35% 65%/60% 40% 60% 40%"></div>
  <img class="t" src="../assets/t-danse-stack.svg" style="left:48px;top:170px;width:984px">
  <img class="fig" src="../assets/figure-ink.png" style="top:20px"><img class="fig" src="../assets/figure-blood.png" style="top:20px">
  <div class="v" style="left:70px;transform:rotate(180deg)">PRIVATE PARTY</div><div class="v" style="right:70px">INVITATION ONLY</div>
  <div class="date" style="top:60px;font-size:60px">31.10</div>
  <div class="info"><div>RUE ROBERT<br>STUMPER</div><div style="text-align:right">BRING A DRINK<br>TO SHARE</div></div>
</section>
</body></html>
