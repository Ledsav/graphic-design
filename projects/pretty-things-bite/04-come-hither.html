<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>N°04 Come Hither</title>
<link rel="stylesheet" href="../../.claude/skills/html-graphics/assets/fonts.css">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="series.css">
<style>
  :root { --bg: #0b0706; --ink: #f6e9e2; --glow: #ffd3c0; --text: "Bodoni Moda", serif; --grain: .5; }

  .photo, .cut { position: absolute; left: -40px; top: 0; width: 1280px; height: 1600px; }
  .photo { z-index: 1; } .cut { z-index: 6; }
  .photo img, .cut img { width: 100%; height: 100%; display: block; }
  .shade { position: absolute; inset: 0; z-index: 2; background: linear-gradient(to top, rgb(11 7 6 / .8), transparent 15%); }

  .t-come   { --m: url(assets/p04/Come-mask.svg);   left: 50px; top: 36px;  width: 1100px; aspect-ratio: 1100 / 346; z-index: 4; }
  .t-hither { --m: url(assets/p04/hither-mask.svg); left: 64px; top: 396px; width: 424px;  aspect-ratio: 540 / 157;  z-index: 4; }
  .chrome img { filter: drop-shadow(0 10px 24px rgb(0 0 0 / .6)); }

  /* inscription ring on the table, behind the resting hand */
  .ring { position: absolute; left: 0; top: 0; width: 1200px; height: 1600px; z-index: 3; overflow: visible; pointer-events: none; }
  .ring text { font: 500 23px "DM Mono"; letter-spacing: .32em; fill: var(--glow); text-transform: uppercase; }
  .ring g { filter: drop-shadow(0 0 6px rgb(255 140 110 / .9)); }

  .foot { position: absolute; z-index: 8; left: 64px; right: 64px; bottom: 64px; display: flex; justify-content: space-between; align-items: end; color: var(--ink); }
  .foot p { font: italic 500 32px/1.15 var(--text); }
  .lockup { position: static; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="bevel" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
    <feSpecularLighting in="b" surfaceScale="7" specularConstant="1.2" specularExponent="26" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="40"/></feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
    <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3=".9" k4="0"/>
  </filter>
</defs></svg>
<section class="artboard" data-name="poster">
  <div class="photo"><img src="assets/src/04.jpg" alt=""></div>
  <div class="shade"></div>

  <div class="chrome t-come"><img src="assets/p04/Come-line.svg" alt="Come"><div class="bevel"><div class="metal"></div></div></div>
  <div class="chrome t-hither"><img src="assets/p04/hither-line.svg" alt="hither"><div class="bevel"><div class="metal"></div></div></div>

  <svg class="ring" viewBox="0 0 1200 1600" data-ignore>
    <path id="ell" d="M 8 1430 A 560 168 -5 0 1 1124 1332" fill="none"/>
    <g><text><textPath href="#ell" startOffset="2%" textLength="1180" lengthAdjust="spacing">Touch nothing · break nothing · summon everything</textPath></text></g>
  </svg>

  <div class="cut"><img src="assets/cut-bf/04.png" alt=""></div>

  <div class="foot">
    <p>A séance for<br>bad hands.</p>
    <div class="lockup">Pretty Things Bite <b>N°04/12</b></div>
  </div>
  <div class="grain"></div>
</section>
</body>
</html>
