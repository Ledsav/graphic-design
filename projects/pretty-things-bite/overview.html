<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pretty Things Bite: overview</title>
<link rel="stylesheet" href="../../.claude/skills/html-graphics/assets/fonts.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="series.css">
<style>
  :root { --bg: #141213; --ink: #efe8de; --dim: #8d857c; --text: "DM Mono", monospace; --grain: .25; }
  .artboard { width: 2160px; height: 2470px; --safe: 72px; }

  .head { position: absolute; left: 72px; right: 72px; top: 76px; display: flex; justify-content: space-between; align-items: end;
          border-bottom: 2px solid #3a3533; padding-bottom: 28px; }
  .head h1 { font: italic 400 110px/.9 "DM Serif Display", serif; color: var(--ink); letter-spacing: -.01em; }
  .head .lockup { position: static; color: var(--ink); font-size: 30px; }
  .head p { font: 500 30px/1.4 var(--text); color: var(--dim); text-transform: uppercase; letter-spacing: .1em; text-align: right; }

  .grid { position: absolute; left: 72px; top: 300px; display: grid; grid-template-columns: repeat(4, 468px); column-gap: 48px; row-gap: 44px; }
  .grid figure img { display: block; width: 468px; height: 624px; box-shadow: 0 18px 40px rgb(0 0 0 / .45); }
  .grid figcaption { margin-top: 16px; display: flex; gap: 16px; font: 500 30px/1 var(--text); letter-spacing: .02em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
  .grid figcaption b { font-weight: 500; color: var(--dim); }
</style>
</head>
<body>
<section class="artboard" data-name="sheet">
  <header class="head">
    <div>
      <div class="lockup" style="margin-bottom: 22px">Pretty Things Bite <b>12 posters</b></div>
      <h1>Pretty things bite.</h1>
    </div>
    <p>Nails, claws, fangs, knives, spikes.<br>Everything that shines here cuts.</p>
  </header>

  <div class="grid">
    <figure><img src="export/01-scream-poster.png" alt=""><figcaption><b>N°01</b>Scream Queen</figcaption></figure>
    <figure><img src="export/02-sharp-poster.png" alt=""><figcaption><b>N°02</b>Sharp</figcaption></figure>
    <figure><img src="export/03-bloody-mary-poster.png" alt=""><figcaption><b>N°03</b>Bloody Mary</figcaption></figure>
    <figure><img src="export/04-come-hither-poster.png" alt=""><figcaption><b>N°04</b>Come Hither</figcaption></figure>
    <figure><img src="export/05-hiss-poster.png" alt=""><figcaption><b>N°05</b>Hiss</figcaption></figure>
    <figure><img src="export/06-two-faced-poster.png" alt=""><figcaption><b>N°06</b>Two-Faced</figcaption></figure>
    <figure><img src="export/07-do-not-pet-poster.png" alt=""><figcaption><b>N°07</b>Do Not Pet</figcaption></figure>
    <figure><img src="export/08-claws-out-poster.png" alt=""><figcaption><b>N°08</b>Claws Out</figcaption></figure>
    <figure><img src="export/09-iced-out-poster.png" alt=""><figcaption><b>N°09</b>Iced Out</figcaption></figure>
    <figure><img src="export/10-hard-disco-poster.png" alt=""><figcaption><b>N°10</b>Hard Disco</figcaption></figure>
    <figure><img src="export/11-nothing-but-net-poster.png" alt=""><figcaption><b>N°11</b>Nothing But Net</figcaption></figure>
    <figure><img src="export/12-girls-will-be-girls-poster.png" alt=""><figcaption><b>N°12</b>Girls Will Be Girls</figcaption></figure>
  </div>
  <div class="grain"></div>
</section>
</body>
</html>
