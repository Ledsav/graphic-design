<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>N°08 Claws Out</title>
<link rel="stylesheet" href="../../.claude/skills/html-graphics/assets/fonts.css">
<link rel="stylesheet" href="series.css">
<style>
  :root { --bg: #2b4479; --ink: #f3f6ff; --navy: #0b1530; --text: "DM Mono", monospace; --grain: .4; }

  /* the photo whole and untouched; the title sits in its dark top third (navy sky, black fur), clear of the claws */
  .photo { position: absolute; z-index: 1; left: -40px; top: 0; width: 1280px; height: 1600px; }
  .photo img { width: 100%; height: 100%; display: block; }
  .shade { position: absolute; inset: 0; z-index: 2;
           background: radial-gradient(80% 42% at 0% 0%, rgb(14 24 52 / .55), transparent 70%); }

  .title { position: absolute; z-index: 4; left: 56px; top: 112px; width: 780px; }
  .title img { display: block; width: 100%; filter: drop-shadow(0 6px 22px rgb(5 10 25 / .45)); }

  .lockup { left: 60px; top: 60px; color: var(--ink); }
  .spec { position: absolute; z-index: 5; left: 60px; bottom: 60px; color: var(--navy);
          font: 500 22px/1.5 var(--text); letter-spacing: .06em; text-transform: uppercase; }
  .spec hr { width: 64px; border: 0; border-top: 2px solid currentColor; margin: 0 0 14px; }
</style>
</head>
<body>
<section class="artboard" data-name="poster">
  <div class="photo"><img src="assets/src/08.jpg" alt=""></div>
  <div class="shade"></div>
  <div class="title"><img src="assets/p08/title.svg" alt="Claws out."></div>

  <div class="lockup">Pretty Things Bite <b>N°08/12</b></div>
  <div class="spec"><hr>The crystal set<br>Four blades, hand-set<br>Retractable? Never.</div>
  <div class="grain"></div>
</section>
</body>
</html>
