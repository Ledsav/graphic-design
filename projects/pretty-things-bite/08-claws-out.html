<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>N°08 Claws Out</title>
<link rel="stylesheet" href="../../.claude/skills/html-graphics/assets/fonts.css">
<link rel="stylesheet" href="series.css">
<style>
  :root { --bg: #3a69bf; --ink: #f4f7ff; --night: #070a14; --text: "DM Mono", monospace; --grain: .45; }

  /* photo, title, then only the claws in front: the words sit over the fur and under the blades */
  .photo, .front { position: absolute; left: -40px; top: 0; width: 1280px; height: 1600px; }
  .photo { z-index: 1; } .front { z-index: 5; }
  .photo img, .front img { width: 100%; height: 100%; display: block; }
  .title { position: absolute; z-index: 4; left: 60px; top: 300px; width: 1080px; }
  .title img { display: block; width: 100%; filter: drop-shadow(0 18px 30px rgb(7 10 20 / .35)); }

  .info { position: absolute; z-index: 6; left: 60px; top: 60px; color: var(--ink); }
  .info p { font: 500 22px/1.45 var(--text); letter-spacing: .06em; text-transform: uppercase; }
  .info .lockup { position: static; margin-bottom: 26px; }
  .tag { position: absolute; z-index: 6; right: 60px; bottom: 60px; text-align: right; color: var(--ink);
         font: 500 22px/1.45 var(--text); letter-spacing: .06em; text-transform: uppercase; }
</style>
</head>
<body>
<section class="artboard" data-name="poster">
  <div class="photo"><img src="assets/src/08.jpg" alt=""></div>
  <div class="title"><img src="assets/p08/title.svg" alt="CLAWS OUT"></div>
  <div class="front"><img src="assets/p08/claws-front.png" alt=""></div>

  <div class="info">
    <div class="lockup">Pretty Things Bite <b>N°08/12</b></div>
    <p>Four crystal blades,<br>hand-set.</p>
  </div>
  <p class="tag">Retractable?<br>Never.</p>
  <div class="grain"></div>
</section>
</body>
</html>
