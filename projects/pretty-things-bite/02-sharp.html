<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>N°02 Sharp</title>
<link rel="stylesheet" href="../../.claude/skills/html-graphics/assets/fonts.css">
<link rel="stylesheet" href="series.css">
<style>
  :root { --bg: #1a1210; --ink: #f6ece0; --red: #b3121b; --dark: #170f0d;
          --serif: "Instrument Serif", serif; --text: "Instrument Sans", sans-serif; --grain: .7; }

  .photo { position: absolute; left: 0; top: -20px; width: 1200px; height: 1756px; z-index: 1;
           filter: contrast(1.06) saturate(1.08); }
  .photo img { width: 100%; height: 100%; display: block; }
  .shade { position: absolute; inset: 0; z-index: 2;
           background: linear-gradient(to top, rgb(23 15 13 / .88) 0, rgb(23 15 13 / .55) 16%, transparent 34%); }

  /* masthead sliced in two along a shallow knife line */
  .mast { position: absolute; z-index: 4; left: 46px; top: 112px; width: 1100px; height: 237px; }
  .mast img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mast .top { clip-path: polygon(0 0, 100% 0, 100% 70%, 0 30%); transform: translate(-30px, -8px); }
  .mast .bot { clip-path: polygon(0 30%, 100% 70%, 100% 100%, 0 100%); transform: translate(30px, 8px); }

  .issue { position: absolute; z-index: 5; left: 64px; right: 64px; top: 64px; display: flex; justify-content: space-between;
           font: 700 18px/1 var(--text); letter-spacing: .16em; text-transform: uppercase; color: var(--dark); }

  .line { position: absolute; z-index: 5; color: var(--dark); }
  .k { font: 700 19px/1.2 var(--text); letter-spacing: .14em; text-transform: uppercase; }
  .h { font: 400 54px/.95 var(--serif); letter-spacing: -.01em; }
  .h i { font-style: italic; }

  .l1 { right: 64px; top: 520px; width: 250px; text-align: right; }
  .l2 { left: 64px; bottom: 210px; color: var(--ink); }
  .l2 .h { font-size: 112px; line-height: .86; }
  .l2 .k { margin-top: 18px; color: var(--ink); }
  .l3 { right: 64px; bottom: 120px; width: 280px; text-align: right; color: var(--ink); }
  .barcode { position: absolute; z-index: 5; right: 64px; bottom: 58px; width: 200px; height: 46px; background: var(--ink); padding: 6px 8px; }
  .barcode i { display: block; height: 100%;
               background: repeating-linear-gradient(90deg, #170f0d 0 2px, transparent 2px 5px, #170f0d 5px 9px, transparent 9px 11px, #170f0d 11px 12px, transparent 12px 16px); }

  .sticker { position: absolute; z-index: 6; right: 62px; top: 262px; width: 176px; height: 176px; border-radius: 50%;
             background: var(--red); color: var(--ink); display: grid; place-content: center; text-align: center;
             transform: rotate(12deg); box-shadow: 0 6px 18px rgb(0 0 0 / .25); }
  .sticker .k { font-size: 18px; letter-spacing: .12em; }
  .sticker .h { font-size: 50px; line-height: .9; }
  .lockup { left: 64px; bottom: 64px; color: var(--ink); }
</style>
</head>
<body>
<section class="artboard" data-name="poster">
  <div class="photo"><img src="assets/src/02.jpg" alt=""></div>
  <div class="shade"></div>

  <div class="issue"><span>Issue N°02 · The beauty &amp; violence issue</span><span>Priceless</span></div>
  <div class="mast">
    <img class="top" src="assets/p02/sharp.svg" alt="SHARP">
    <img class="bot" src="assets/p02/sharp.svg" alt="">
  </div>

  <div class="line l1"><div class="k">Cold steel,</div><div class="h"><i>warm</i> lips</div></div>
  <div class="line l2"><div class="h">The <i>five-inch</i><br>wing</div><div class="k">A tutorial in steel · p. 13</div></div>
  <div class="line l3"><div class="h"><i>Pretty</i> is a weapon</div></div>
  <div class="sticker"><div class="k">Free</div><div class="h"><i>blade</i></div><div class="k">inside</div></div>
  <div class="barcode"><i></i></div>

  <div class="lockup">Pretty Things Bite <b>N°02/12</b></div>
  <div class="grain"></div>
</section>
</body>
</html>
