<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>N°11 Nothing But Net</title>
<link rel="stylesheet" href="../../.claude/skills/html-graphics/assets/fonts.css">
<link rel="stylesheet" href="series.css">
<style>
  :root { --bg: #2a2724; --ink: #1d1a17; --cream: #f1e9dc; --red: #d2321f; --text: "Instrument Serif", serif; --grain: .45; }

  /* NET is painted on the wall (hard-light), so the net's real shadow falls across it; the crystal net hangs in front */
  .photo, .front { position: absolute; left: -8px; top: 0; width: 1216px; height: 1601px; }
  .photo { z-index: 1; } .front { z-index: 5; }
  .photo img, .front img { width: 100%; height: 100%; display: block; }
  .net { position: absolute; z-index: 3; left: 60px; bottom: 60px; width: 1080px; mix-blend-mode: hard-light; }
  .net img { display: block; width: 100%; }
  .nothing { position: absolute; z-index: 3; left: 60px; top: 96px; width: 1080px; }
  .nothing img { display: block; width: 100%; }

  .copy { position: absolute; z-index: 6; left: 60px; top: 832px; width: 300px; color: var(--cream); }
  .copy p { font: italic 400 44px/1 var(--text); }
  .lockup { left: 60px; top: 60px; color: var(--cream); }
</style>
</head>
<body>
<section class="artboard" data-name="poster">
  <div class="photo"><img src="assets/src/11.jpg" alt=""></div>
  <div class="nothing"><img src="assets/p11/nothing.svg" alt="NOTHING BUT"></div>
  <div class="net"><img src="assets/p11/net.svg" alt="NET"></div>
  <div class="front"><img src="assets/p11/net-front.png" alt=""></div>

  <div class="copy"><p>Luxury is a<br>contact sport.</p></div>
  <div class="lockup">Pretty Things Bite <b>N°11/12</b></div>
  <div class="grain"></div>
</section>
</body>
</html>
