<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>puls</title>
<link rel="stylesheet" href="../_base.css">
<link rel="stylesheet" href="tokens.css">
<style>
  .artboard { width: 1080px; height: 1527px; --safe: 60px; }

  /* Header on the grid: series left (cols 1-3), season right (cols 5-6). */
  .head { position: absolute; left: var(--margin); right: var(--margin); top: 60px; display: grid; grid-template-columns: repeat(6, 1fr); column-gap: var(--gutter); }
  .head .a { grid-column: 1 / 4; } .head .b { grid-column: 5 / 7; }
  .rule { position: absolute; left: var(--margin); right: var(--margin); top: 160px; border-top: 3px solid var(--ink); }

  /* Rhythm matrix: one circle per grid cell, diameter from a beat pattern, one red beat. */
  .matrix { position: absolute; left: var(--margin); right: var(--margin); top: 210px; height: 800px;
    display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(5, 1fr); column-gap: var(--gutter); row-gap: var(--gutter); }
  .matrix i { place-self: center start; border-radius: 50%; background: var(--ink); }
  .matrix i.beat { background: var(--signal); }

  .title { position: absolute; left: 44px; bottom: -78px; font-size: 470px; }
  .prog { position: absolute; left: calc(var(--margin) + 4 * (960px - 100px) / 6 + 4 * var(--gutter)); right: var(--margin); top: 1036px; }
  .prog li { list-style: none; display: grid; grid-template-columns: 74px 1fr; padding: 10px 0 12px; border-top: 2px solid var(--ink); }
  .prog li b { font-weight: 700; }
</style>
</head>
<body>
<section class="artboard" data-name="poster">
  <div class="head">
    <p class="a swiss-small"><b>Werkhof Basel</b><br>Konzertreihe für neue Musik<br>werkhof.example</p>
    <p class="b swiss-small" style="text-align:right"><b>Frühjahr 2027</b><br>Halle 3, jeweils 20.00<br>Eintritt frei</p>
  </div>
  <div class="rule"></div>
  <div class="matrix" id="m"></div>
  <h1 class="title swiss-display" data-ignore>puls</h1>
  <ul class="prog swiss-small">
    <li><b>12.03</b><span>Schlagwerk</span></li>
    <li><b>26.03</b><span>Stimmen</span></li>
    <li><b>09.04</b><span>Elektronik</span></li>
    <li><b>23.04</b><span>Stille</span></li>
  </ul>
  <div class="swiss-grid-guide"></div>
  <div class="grain"></div>
</section>
<script>
  // Beat pattern: diameters follow two interfering pulses across the grid; the strongest beat is red.
  const m = document.getElementById('m');
  let html = '';
  for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) {
    const v = Math.abs(Math.sin(c * 0.95 + r * 0.6)) * Math.abs(Math.cos(r * 0.8 - c * 0.35));
    const d = Math.round(14 + v * 128);
    const beat = r === 1 && c === 4;
    html += `<i class="${beat ? 'beat' : ''}" style="width:${beat ? 143 : d}px;height:${beat ? 143 : d}px"></i>`;
  }
  m.innerHTML = html;
</script>
</body>
</html>
