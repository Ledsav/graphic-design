<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zero G</title>
<link rel="stylesheet" href="../_base.css">
<link rel="stylesheet" href="tokens.css">
<style>
  .artboard { width: 1080px; height: 1350px; --safe: 56px;
    background:
      radial-gradient(46% 34% at 74% 46%, rgb(185 165 255 / .38), transparent 70%),
      radial-gradient(70% 55% at 60% 42%, var(--indigo), var(--bg) 72%); }

  /* Faint star dust: two offset dot screens. */
  .stars { position: absolute; inset: 0; z-index: 0; opacity: .55;
    background: radial-gradient(circle, #fff 0 1.2px, transparent 1.6px) 0 0 / 97px 89px,
                radial-gradient(circle, var(--baby) 0 1px, transparent 1.4px) 41px 23px / 151px 137px; }

  /* Giant G: the hole in its bar sits just past the right edge, so the bar reads as solid. */
  .g, .g-front { left: 236px; top: 290px; width: 1326px; aspect-ratio: 1326 / 1166; --m: url(assets/g-mask.svg); }
  .g { z-index: 2; }
  .g > img { filter: drop-shadow(0 0 28px rgb(185 165 255 / .55)); }
  .g-front { z-index: 6; clip-path: polygon(608px 510px, 100% 510px, 100% 100%, 608px 100%); }   /* the bar block only, in whole px: its edges are real letter edges */
  .zero { left: 56px; top: 92px; width: 638px; aspect-ratio: 638 / 148; z-index: 8; --m: url(assets/zero-mask.svg); transform: rotate(-5deg); }
  .zero > img { filter: drop-shadow(0 0 16px rgb(185 165 255 / .8)); }

  /* The astronaut floats out of the counter: in front of the stem and top arm, behind the bar; the lineup window hides her cut-off waist. */
  .astro { position: absolute; left: 300px; top: 270px; width: 800px; height: 800px; z-index: 5; transform: rotate(-30deg); --m: url(assets/astronaut-holo.png); }
  .astro img { width: 100%; height: 100%; display: block; }

  /* Orbit ring round the astronaut: back half behind her, front half (clipped copy) in front of everything. */
  .orbit { position: absolute; left: 235px; top: 590px; width: 980px; height: 303px; overflow: visible; transform: rotate(-18deg); }
  .orbit.back { z-index: 4; }
  .orbit.front { z-index: 7; clip-path: inset(50% -2% -10% -2%); }

  .bubble-1 { left: 262px; top: 600px; width: 118px; height: 118px; z-index: 8; }
  .bubble-2 { left: 120px; top: 720px; width: 50px; height: 50px; z-index: 8; }
  .bubble-3 { left: 930px; top: 236px; width: 84px; height: 84px; z-index: 8; }

  .s1 { left: 236px; top: 262px; width: 92px; z-index: 9; }
  .s2 { left: 700px; top: 52px; width: 40px; z-index: 9; }
  .s3 { left: 980px; top: 742px; width: 70px; z-index: 9; }

  /* Info: date top right, venue up the G's stem, lineup in a window over the bowl, the pill under it. */
  .date { position: absolute; right: 56px; top: 64px; z-index: 9; text-align: right; }
  .date .d { font: 400 40px/1 var(--display); letter-spacing: .02em; margin-top: 10px; text-shadow: 0 0 18px rgb(185 165 255 / .9); }
  .date .t { margin-top: 12px; }
  .lime { color: var(--lime); }

  .venue { position: absolute; left: 192px; top: 960px; z-index: 9; transform-origin: left top; transform: rotate(-90deg);
    white-space: nowrap; color: var(--baby); }

  .lineup { left: 452px; top: 1004px; width: 420px; z-index: 10; transform: rotate(-3deg); }
  .lineup header i { display: inline-block; width: 12px; height: 12px; margin-left: 6px; border: 2px solid var(--navy); border-radius: 50%; background: #fff; }
  .lineup ul { list-style: none; padding: 12px 18px 16px; }
  .lineup li { display: flex; justify-content: space-between; padding: 4px 0; }
  .lineup li span { color: #4a3cc4; }
  .lineup .bar { height: 16px; margin: 12px 18px 0; border: 2px solid var(--navy); border-radius: 8px;
    background: linear-gradient(90deg, var(--lime) 0 87%, transparent 87%); }

  .cta { position: absolute; left: 56px; bottom: 56px; z-index: 10; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Inflated chrome bevel: specular light on the blurred alpha. stdDeviation ~ stroke thickness / 3 for small type, / 10 for giant type. -->
    <filter id="y2k-bevel" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b"/>
      <feSpecularLighting in="b" surfaceScale="7" specularConstant="1.25" specularExponent="26" lighting-color="#ffffff" result="s">
        <feDistantLight azimuth="235" elevation="40"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3=".95" k4="0"/>
    </filter>
    <filter id="y2k-bevel-xl" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="b"/>
      <feSpecularLighting in="b" surfaceScale="12" specularConstant="1.3" specularExponent="22" lighting-color="#ffffff" result="s">
        <feDistantLight azimuth="235" elevation="38"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3=".9" k4="0"/>
    </filter>
    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#b9a5ff"/><stop offset=".35" stop-color="#ffffff"/><stop offset=".6" stop-color="#9fd4ff"/><stop offset="1" stop-color="#ff9de2"/>
    </linearGradient>
    <ellipse id="ring-path" cx="550" cy="170" rx="530" ry="150" fill="none"/>
    <path id="spark" d="M50 0C53 38 62 47 100 50C62 53 53 62 50 100C47 62 38 53 0 50C38 47 47 38 50 0Z"/>
  </defs>
</svg>

<section class="artboard" data-name="poster">
  <div class="stars"></div>

  <div class="y2k-chrome-type xl g"><img src="assets/g-line.svg" alt=""><div class="y2k-bevel"><div class="y2k-chrome"></div></div></div>
  <svg class="orbit back" viewBox="0 0 1100 340"><use href="#ring-path" stroke="#0a0f2c" stroke-width="14"/><use href="#ring-path" stroke="url(#ring)" stroke-width="6"/></svg>
  <div class="astro"><img src="assets/astronaut-holo.png" alt="Astronaut floating"><div class="y2k-holo-sheen"></div></div>
  <div class="y2k-chrome-type xl g-front"><img src="assets/g-line.svg" alt=""><div class="y2k-bevel"><div class="y2k-chrome"></div></div></div>
  <svg class="orbit front" viewBox="0 0 1100 340"><use href="#ring-path" stroke="#0a0f2c" stroke-width="14"/><use href="#ring-path" stroke="url(#ring)" stroke-width="6"/></svg>
  <div class="y2k-chrome-type zero"><img src="assets/zero-line.svg" alt="Zero G"><div class="y2k-bevel"><div class="y2k-chrome"></div></div></div>

  <div class="y2k-bubble bubble-1"></div><div class="y2k-bubble bubble-2"></div><div class="y2k-bubble bubble-3"></div>
  <svg class="y2k-sparkle s1" viewBox="0 0 100 100"><use href="#spark"/></svg>
  <svg class="y2k-sparkle s2" viewBox="0 0 100 100"><use href="#spark"/></svg>
  <svg class="y2k-sparkle s3" viewBox="0 0 100 100"><use href="#spark"/></svg>

  <div class="date">
    <p class="y2k-pixel"><b>New Year's Eve</b></p>
    <p class="d">31.12.26</p>
    <p class="y2k-pixel t">22:00 <span class="lime">&rarr;</span> 06:00</p>
  </div>

  <p class="venue y2k-pixel">Kepler Dome &middot; Pier 9 &middot; Y2K revival</p>

  <div class="y2k-window lineup">
    <header><span>lineup.txt</span><span><i></i><i></i><i></i></span></header>
    <div class="bar"></div>
    <ul class="y2k-pixel">
      <li><b>Dial-Up Diva</b><span>22:00</span></li>
      <li><b>Megapixel</b><span>00:00</span></li>
      <li><b>Saturn Rings</b><span>02:00</span></li>
      <li><b>Glitter.exe</b><span>04:00</span></li>
    </ul>
  </div>

  <p class="cta"><span class="y2k-pill">Tickets &#9656; zerog.example</span></p>

  <div class="grain"></div>
</section>
</body>
</html>
