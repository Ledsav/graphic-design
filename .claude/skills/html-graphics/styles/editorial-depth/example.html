<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame</title>
<link rel="stylesheet" href="../_base.css">
<link rel="stylesheet" href="tokens.css">
<style>

  .artboard {
    position: relative; overflow: hidden; isolation: isolate;
    width: 1080px; height: 1350px; --safe: 44px;
    background: #0c1014; color: var(--ink); font-family: var(--text);
  }
  /* Photo and its cut-out share one box so they line up exactly. */
  .photo, .cut { position: absolute; left: -330px; top: 150px; width: 1500px; height: 1500px; }
  .photo { background: url(assets/cameraman-duo.png) center / cover; z-index: 0; filter: brightness(.82) contrast(1.08); }
  .cut { z-index: 3; }
  .shade { position: absolute; inset: 0; z-index: 1; background: linear-gradient(#0c1014 8%, transparent 40%), radial-gradient(70% 60% at 45% 55%, transparent, rgb(12 16 20 / .6)); }
  .rays { position: absolute; left: 20%; top: -10%; width: 70%; height: 90%; z-index: 1; mix-blend-mode: screen; opacity: .35; filter: blur(14px);
    background: repeating-conic-gradient(from 170deg at 50% 0%, transparent 0 4deg, rgb(233 227 212 / .5) 5deg 6deg, transparent 7deg 11deg);
    -webkit-mask: linear-gradient(#000, transparent 85%); mask: linear-gradient(#000, transparent 85%); }

  .title { position: absolute; left: 30px; right: 30px; top: 168px; z-index: 2; text-align: center; white-space: nowrap;
    font: 560 330px/1 var(--display); font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1; letter-spacing: -.03em; }
  .sub { position: absolute; left: 0; right: 0; top: 92px; z-index: 4; text-align: center; font: italic 300 44px/1 var(--display); font-variation-settings: "opsz" 40; }

  .col { position: absolute; z-index: 4; width: 260px; font: 400 19px/1.35 var(--text); }
  .col h2 { font: 700 34px/1 var(--text); margin-bottom: 10px; letter-spacing: -.01em; }
  .col.l { left: 44px; top: 760px; } .col.r { right: 44px; top: 640px; text-align: right; }

  .meta { position: absolute; z-index: 4; font: 700 17px/1.3 var(--text); }
  .m-tl { left: 44px; top: 44px; } .m-tr { right: 44px; top: 44px; text-align: right; }
  .m-bl { left: 44px; bottom: 44px; } .m-br { right: 44px; bottom: 44px; }
  .barcode { display: block; width: 150px; height: 56px; }

</style>
</head>
<body>
<section class="artboard" data-name="cover">
  <div class="photo"></div><div class="shade"></div><div class="rays"></div>
  <p class="sub">The camera issue</p>
  <h1 class="title" data-allow-overlap>Frame</h1>
  <img class="cut" src="assets/cameraman-cut-duo.png" alt="">
  <div class="col l"><h2>Slow light</h2>Six photographers who still wait for the chemistry to finish.</div>
  <div class="col r"><h2>Tripod logic</h2>Why the steadiest pictures come from the least steady people.</div>
  <div class="meta m-tl">FRAME</div><div class="meta m-tr">Issue 07</div>
  <div class="meta m-bl">Nov 2026<br>€9.00</div>
  <div class="meta m-br"><svg class="barcode" viewBox="0 0 150 56" id="bc"></svg></div>
  <div class="grain"></div>
</section>
<script>
  // Decorative barcode: random bar widths, fixed seed so renders repeat.
  let s = 7, x = 0, bars = '';
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  while (x < 150) { const w = 1 + Math.floor(rnd() * 4); if (rnd() > .45) bars += `<rect x="${x}" width="${w}" height="56" fill="#e9e3d4"/>`; x += w + 1; }
  document.getElementById('bc').innerHTML = bars;
</script>
</body>
</html>
