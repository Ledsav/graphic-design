<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box} body{background:#777;padding:40px;display:flex;flex-wrap:wrap;gap:40px}
.artboard{position:relative;overflow:hidden;isolation:isolate;width:1080px;height:1350px;background:#c3161c;flex:none}
.artboard > *{position:absolute;display:block}
.astro{filter:drop-shadow(0 0 0 #fff)}
</style></head><body>
<section class="artboard" data-name="a-sandwich">
  <img src="assets/liftoff-title.svg" style="left:40px;top:50px;width:1000px">
  <img class="astro" src="../_shared/photos/astronaut-cut.png" style="left:-40px;top:400px;width:1160px">
</section>
<section class="artboard" data-name="b-giant-crop">
  <img class="astro" src="../_shared/photos/astronaut-cut.png" style="left:-520px;top:-60px;width:2100px">
  <img src="assets/liftoff-line.svg" style="left:90px;top:1020px;width:900px;transform:rotate(-5deg)">
</section>
<section class="artboard" data-name="c-diagonal">
  <img class="astro" src="../_shared/photos/astronaut-cut.png" style="left:180px;top:420px;width:1150px">
  <img src="assets/liftoff-solid.svg" style="left:-60px;top:470px;width:1240px;transform:rotate(-14deg)">
</section>
<section class="artboard" data-name="d-echo">
  <img src="assets/liftoff-solid.svg" style="left:40px;top:60px;width:1000px">
  <img src="assets/liftoff-outline.svg" style="left:40px;top:250px;width:1000px">
  <img src="assets/liftoff-outline.svg" style="left:40px;top:440px;width:1000px;opacity:.7">
  <img src="assets/liftoff-outline.svg" style="left:40px;top:630px;width:1000px;opacity:.45">
  <img class="astro" src="../_shared/photos/astronaut-cut.png" style="left:110px;top:500px;width:900px">
</section>
<section class="artboard" data-name="e-frame">
  <img src="assets/liftoff-solid.svg" style="left:-560px;top:580px;width:1300px;transform:rotate(-90deg)">
  <img src="assets/liftoff-outline.svg" style="left:330px;top:580px;width:1300px;transform:rotate(90deg)">
  <img class="astro" src="../_shared/photos/astronaut-cut.png" style="left:170px;top:420px;width:760px">
</section>
</body></html>
